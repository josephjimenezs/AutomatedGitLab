services:
  gitlab:
    image: docker.io/gitlab/gitlab-ce:19.2.2-ce.0
    container_name: xotrik-gitlab
    hostname: xotrik-gitlab
    restart: unless-stopped
    stop_grace_period: 5m
    ports:
      - "8080:80"
      - "4443:443"
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url '${GITLAB_EXTERNAL_URL}'
        gitlab_rails['gitlab_shell_ssh_port'] = 22
        gitlab_rails['gitlab_host'] = 'xotrik-gitlab'
    entrypoint: [ "/bin/bash", "-c" ]
    command:
      - >
        set -uo pipefail;

        echo "[ENTRYPOINT] Starting GitLab in background..."; /assets/init-container &

        echo "[INIT] Waiting for GitLab to become ready..."; until curl -sf http://localhost/-/readiness; do
          echo "[INIT] GitLab not ready yet. Retrying in 10s...";
          sleep 10;
        done

        echo "[INIT] Setting GitLab root password..."; gitlab-rails runner "
          user = User.find_by_username('root');
          user.password = '${GITLAB_ROOT_PASSWORD}';
          user.password_confirmation = '${GITLAB_ROOT_PASSWORD}';
          user.save!
        "

        echo "[INIT] Ensuring runner-token directory exists..."; mkdir -p /runner-token

        echo "[INIT] Setting internal clone URL..."; gitlab-rails runner "
          app = ApplicationSetting.current;
          app.http_clone_url = '${GITLAB_CLONE_URL}';
          app.save!
        "

        echo "[INIT] Fetching registration token..."; TOKEN=$$(gitlab-rails runner "puts Gitlab::CurrentSettings.current_application_settings.runners_registration_token" | tail -n1); echo "$$TOKEN" > /runner-token/runner-registration-token.txt

        echo "[INIT] Restarting GitLab..."; gitlab-ctl restart

        echo "[INIT] Waiting for GitLab to continue running..."; wait
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/-/readiness" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 5m
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-logs:/var/log/gitlab
      - gitlab-data:/var/opt/gitlab
      - runner-token:/runner-token
    shm_size: "2gb"
    networks:
      xotrik-gitlab-network:
        aliases:
          - xotrik-gitlab

  gitlab-runner:
    image: docker.io/gitlab/gitlab-runner:v19.2.1
    container_name: xotrik-gitlab-runner
    restart: unless-stopped
    depends_on:
      gitlab:
        condition: service_healthy
    volumes:
      - runner-config:/etc/gitlab-runner
      - runner-token:/runner-token:ro
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/podman/podman.sock:/var/run/docker.sock
    security_opt:
      - label=disable
    environment:
      - GITLAB_URL=${GITLAB_CLONE_URL}
      - GITLAB_ROOT_USER=root
      - GITLAB_ROOT_PASSWORD=${GITLAB_ROOT_PASSWORD}
    entrypoint: [ "/bin/bash", "-c" ]
    command:
      - >
        set -uo pipefail;

        if [ -f /etc/gitlab-runner/config.toml ] && grep -q '\[\[runners\]\]' /etc/gitlab-runner/config.toml; then
          echo "[RUNNER INIT] Runner already registered, skipping registration.";
        else
          echo "[RUNNER INIT] Waiting for registration token...";
          until [ -s /runner-token/runner-registration-token.txt ]; do
            echo "[RUNNER INIT] Token not yet available, retrying in 5s...";
            sleep 5;
          done;
          REG_TOKEN=$$(cat /runner-token/runner-registration-token.txt);

          echo "[RUNNER INIT] Registering GitLab Runner...";
          i=0;
          until gitlab-runner register \
            --non-interactive \
            --url "$${GITLAB_URL}" \
            --registration-token "$${REG_TOKEN}" \
            --executor "docker" \
            --docker-image "docker:latest" \
            --description "xotrik-runner" \
            --docker-network-mode "xotrik-gitlab-network" \
            --tag-list "xotrik" \
            --run-untagged="true" \
            --locked="false"; do
            i=$$((i + 1));
            if [ "$$i" -ge 10 ]; then
              echo "[RUNNER INIT] Registration failed after 10 attempts, giving up.";
              exit 1;
            fi
            echo "[RUNNER INIT] Registration attempt $$i failed, retrying in 10s...";
            sleep 10;
          done;

          if ! grep -q 'clone_url' /etc/gitlab-runner/config.toml; then
            echo "[RUNNER INIT] Patching config.toml for clone_url...";
            sed -i '/^\s*url = /a \    clone_url = "http://xotrik-gitlab:80"' /etc/gitlab-runner/config.toml
          fi
        fi

        echo "[RUNNER INIT] Starting GitLab Runner in foreground..."; exec gitlab-runner run --user=gitlab-runner --working-directory=/home/gitlab-runner
    networks:
      - xotrik-gitlab-network

networks:
  xotrik-gitlab-network:
    name: xotrik-gitlab-network

volumes:
  gitlab-config:
  gitlab-logs:
  gitlab-data:
  runner-config:
  runner-token:
